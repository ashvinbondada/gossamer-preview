name: Record OpenVSX downloads

# OpenVSX's API only exposes the current cumulative download count, not history.
# This job polls it daily and appends a timestamped row to
# docs/openvsx-downloads.csv so we build up our own time series.

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and record download count
        run: node scripts/openvsx-downloads.mjs --record

      - name: Commit history if changed
        run: |
          if [[ -n "$(git status --porcelain docs/openvsx-downloads.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/openvsx-downloads.csv
            git commit -m "chore: record OpenVSX download count"
            git push
          else
            echo "No change in download count; nothing to commit."
          fi
